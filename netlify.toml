# Netlify Configuration for NotebookLM Průvodce

[build]
  command = "node scripts/build-production.js"
  publish = "dist"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; media-src 'self' blob:; upgrade-insecure-requests"
    
    # Cache control for static assets
    Cache-Control = "public, max-age=0, must-revalidate"

# Images may be cached briefly; filenames are not fingerprinted.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects and rewrites
# Redirect HTTP to HTTPS automatically
[[redirects]]
  from = "http://notebooklm-pruvodce.netlify.app/*"
  to = "https://notebooklm-pruvodce.netlify.app/:splat"
  status = 301
  force = true

# 404 page redirect
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Pretty URLs (optional - enables /about instead of /about.html)
